<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification — Alumni Portal</title>
    <meta name="description" content="Verify your alumni email address to activate your account." />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="login-container">
      <div class="login-card" style="text-align:center;">
        <div class="brand" style="justify-content:center;">
          <div class="brand-icon">
            <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
              <rect width="32" height="32" rx="8" fill="url(#vg)" />
              <path d="M8 22L16 10L24 22H8Z" fill="white" opacity="0.9" />
              <circle cx="16" cy="10" r="2.5" fill="white" />
              <defs>
                <linearGradient id="vg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#6366f1" /><stop offset="1" stop-color="#8b5cf6" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="brand-text">
            <h1>Email Verification</h1>
          </div>
        </div>

        <div id="verify-status" class="loading-spinner">
          <div class="spinner-ring"></div>
          <p>Verifying your email address…</p>
        </div>

        <div id="verify-success" class="hidden" style="padding:20px 0;">
          <div style="font-size:3rem;margin-bottom:12px;">✅</div>
          <h2 style="color:var(--success);margin-bottom:8px;">Email Verified!</h2>
          <p class="text-muted">Your account is now active. Redirecting to login…</p>
        </div>

        <div id="verify-error" class="hidden" style="padding:20px 0;">
          <div style="font-size:3rem;margin-bottom:12px;">❌</div>
          <h2 style="color:var(--error);margin-bottom:8px;">Verification Failed</h2>
          <p class="text-muted" id="verify-error-msg">Invalid or expired verification token.</p>
          <a href="login.html" class="btn-primary" style="display:inline-flex;margin-top:16px;">Go to Login</a>
        </div>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/verify.js"></script>
  </body>
</html>
