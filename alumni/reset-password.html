<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — Alumni Portal</title>
    <meta name="description" content="Reset your alumni account password using your reset token." />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="login-container">
      <div class="login-card">
        <div class="brand">
          <div class="brand-icon">
            <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
              <rect width="32" height="32" rx="8" fill="url(#rg)" />
              <path d="M8 22L16 10L24 22H8Z" fill="white" opacity="0.9" />
              <circle cx="16" cy="10" r="2.5" fill="white" />
              <defs>
                <linearGradient id="rg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#6366f1" /><stop offset="1" stop-color="#8b5cf6" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="brand-text">
            <h1>Reset Password</h1>
            <p>Enter your reset token and new password</p>
          </div>
        </div>

        <div class="alert hidden" id="alert-box" role="alert">
          <span id="alert-message"></span>
          <button class="alert-close" onclick="document.getElementById('alert-box').className='alert hidden'">×</button>
        </div>

        <form id="reset-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="reset-token">Reset Token</label>
            <input
              type="text"
              id="reset-token"
              placeholder="Paste your reset token from email / server console"
              required
            />
          </div>
          <div class="form-group">
            <label for="reset-password">New Password</label>
            <div class="password-wrap">
              <input
                type="password"
                id="reset-password"
                placeholder="Min 8 chars, uppercase, number, symbol"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="toggle-pw"
                aria-label="Toggle password"
                onclick="togglePw()"
              >
                👁
              </button>
            </div>
            <div class="pw-strength">
              <div class="pw-strength-fill" id="pw-fill"></div>
            </div>
          </div>
          <button type="submit" class="btn-primary btn-full" id="reset-btn">
            <span class="btn-text">Reset Password</span>
            <span class="btn-spinner hidden"></span>
          </button>
          <a href="login.html" class="back-link">← Back to Sign In</a>
        </form>

        <div id="reset-success" class="hidden" style="text-align:center;padding:20px 0;">
          <div style="font-size:3rem;margin-bottom:12px;">✅</div>
          <h2 style="color:var(--success);margin-bottom:8px;">Password Reset!</h2>
          <p class="text-muted">Redirecting to login…</p>
        </div>
      </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/reset-password.js"></script>
  </body>
</html>
